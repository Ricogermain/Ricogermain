<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Rico Germain, développeur Full Stack web et mobile">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020">
        <animate attributeName="stop-color" values="#0b1020;#101a3a;#0b1020" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#1b1040">
        <animate attributeName="stop-color" values="#1b1040;#0b2a3a;#1b1040" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="h-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="h-type">
      <rect x="60" y="62" width="0" height="90">
        <animate attributeName="width" calcMode="discrete" dur="1.8s" begin="0.4s" fill="freeze"
                 values="0;38;76;114;152;190;228;266;304;342;380;418;456"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="300" fill="url(#h-bg)"/>

  <!-- particules -->
  <g fill="#22d3ee">
    <circle cx="120" cy="40" r="2"><animate attributeName="cy" values="40;20;40" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="28" r="1.6"><animate attributeName="cy" values="28;50;28" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="250" r="2"><animate attributeName="cy" values="250;228;250" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#f472b6">
    <circle cx="300" cy="36" r="1.8"><animate attributeName="cy" values="36;58;36" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="60" r="2.2"><animate attributeName="cy" values="60;38;60" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ornement à droite : anneau + orbites -->
  <g transform="translate(800 140)">
    <circle r="92" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle r="62" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="40 14">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <circle cx="92" cy="0" r="6" fill="#22d3ee"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="14s" repeatCount="indefinite"/>
      <circle cx="62" cy="0" r="5" fill="#f472b6"/>
    </g>
    <text x="0" y="14" text-anchor="middle" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="42" font-weight="700" fill="#e2e8f0">&lt;/&gt;
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- texte -->
  <text x="60" y="52" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#94a3b8" opacity="0">Salut, je suis
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze"/>
  </text>

  <g clip-path="url(#h-type)">
    <text x="60" y="130" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#h-name)">Rico Germain</text>
  </g>
  <rect x="60" y="76" width="4" height="62" rx="2" fill="#22d3ee">
    <animate attributeName="x" calcMode="discrete" dur="1.8s" begin="0.4s" fill="freeze"
             values="60;98;136;174;212;250;288;326;364;402;440;478;516"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="2.2s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#e2e8f0">
    <text x="60" y="186" opacity="0">Développeur Full Stack · Web &amp; Mobile
      <animate attributeName="opacity" dur="10.5s" begin="2.4s" repeatCount="indefinite" calcMode="discrete"
               keyTimes="0;0.31;0.33;1" values="1;1;0;0"/>
    </text>
    <text x="60" y="186" opacity="0">Interfaces soignées, architecture propre
      <animate attributeName="opacity" dur="10.5s" begin="2.4s" repeatCount="indefinite" calcMode="discrete"
               keyTimes="0;0.33;0.64;0.66;1" values="0;1;1;0;0"/>
    </text>
    <text x="60" y="186" opacity="0">Génie Logiciel &amp; Bases de Données
      <animate attributeName="opacity" dur="10.5s" begin="2.4s" repeatCount="indefinite" calcMode="discrete"
               keyTimes="0;0.66;0.98;1" values="0;1;1;0"/>
    </text>
  </g>

  <!-- statut -->
  <g>
    <rect x="60" y="214" width="372" height="38" rx="19" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="82" cy="233" r="5" fill="#4ade80">
      <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="239" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#e2e8f0">Disponible pour toute collaboration</text>
  </g>

  <!-- vagues -->
  <path fill="#22d3ee" fill-opacity="0.14"
        d="M0 268 q62.5 -26 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 V300 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path fill="#a78bfa" fill-opacity="0.16"
        d="M-250 276 q62.5 22 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 V300 H-250 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="20s" repeatCount="indefinite"/>
  </path>
</svg>
